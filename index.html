<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="noindex, nofollow">
    <title>Birthdays</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css?v=1">
</head>
<body>

<!-- Sign in -->
<section id="login" class="login" hidden>
    <form class="login-card" id="login-form">
        <div class="login-mark">🎂</div>
        <h1>Birthdays</h1>
        <p class="muted">Sign in to see who's next.</p>
        <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <p class="form-error" id="login-error" hidden></p>
        <button class="btn primary wide" type="submit">Sign in</button>
    </form>
</section>

<!-- App -->
<div id="app" class="app" hidden>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">🎂</span>
            <span class="brand-name">Birthdays</span>
        </div>
        <div class="topbar-actions">
            <button class="icon-btn" id="open-settings" type="button" aria-label="Settings">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm8.6-2.3.1-1.2-.1-1.2 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2-1.2L15.8 3h-4l-.4 2.5a8 8 0 0 0-2 1.2L7 5.8l-2 3.4 2 1.6-.1 1.2.1 1.2-2 1.6 2 3.4 2.4-.9c.6.5 1.3.9 2 1.2l.4 2.5h4l.4-2.5c.7-.3 1.4-.7 2-1.2l2.4.9 2-3.4-2-1.6Z"/></svg>
            </button>
            <button class="btn primary" id="open-add" type="button">
                <span aria-hidden="true">＋</span> Add
            </button>
        </div>
    </header>

    <main class="main">
        <section id="hero" class="hero"></section>

        <div class="controls">
            <div class="tabs" role="tablist">
                <button role="tab" class="tab active" data-view="upcoming" aria-selected="true">Upcoming</button>
                <button role="tab" class="tab" data-view="calendar" aria-selected="false">By month</button>
            </div>
            <label class="search">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 4a6 6 0 0 1 4.8 9.6l4.8 4.8-1.4 1.4-4.8-4.8A6 6 0 1 1 10 4Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
                <input type="search" id="search" placeholder="Search names, tags, notes" autocomplete="off">
            </label>
        </div>

        <section id="list" class="list" aria-live="polite"></section>
    </main>
</div>

<!-- Add / edit -->
<dialog id="edit-dialog" class="sheet">
    <form id="edit-form" method="dialog" novalidate>
        <header class="sheet-head">
            <h2 id="edit-title">Add birthday</h2>
            <button class="icon-btn" value="cancel" formnovalidate aria-label="Close">✕</button>
        </header>
        <div class="sheet-body">
            <label class="field">
                <span>Name</span>
                <input name="name" required maxlength="120" autocomplete="off">
            </label>
            <div class="row3">
                <label class="field">
                    <span>Day</span>
                    <select name="day" required></select>
                </label>
                <label class="field">
                    <span>Month</span>
                    <select name="month" required></select>
                </label>
                <label class="field">
                    <span>Year <em>optional</em></span>
                    <input name="year" type="number" inputmode="numeric" min="1900" placeholder="—">
                </label>
            </div>
            <label class="field">
                <span>Relation</span>
                <input name="relation" maxlength="60" placeholder="friend, sister, client…" autocomplete="off">
            </label>
            <label class="field">
                <span>Tags <em>comma-separated</em></span>
                <input name="tags" placeholder="family, work" autocomplete="off">
            </label>
            <label class="field">
                <span>Gift ideas</span>
                <textarea name="gift_ideas" rows="2" maxlength="2000"></textarea>
            </label>
            <label class="field">
                <span>Notes</span>
                <textarea name="notes" rows="2" maxlength="2000"></textarea>
            </label>
            <p class="form-error" id="edit-error" hidden></p>
        </div>
        <footer class="sheet-foot">
            <button class="btn danger-ghost" type="button" id="delete-btn" hidden>Delete</button>
            <span class="spacer"></span>
            <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
            <button class="btn primary" type="submit" id="save-btn">Save</button>
        </footer>
    </form>
</dialog>

<!-- Settings -->
<dialog id="settings-dialog" class="sheet">
    <div>
        <header class="sheet-head">
            <h2>Settings</h2>
            <button class="icon-btn" type="button" data-close aria-label="Close">✕</button>
        </header>
        <div class="sheet-body" id="settings-body">
            <p class="muted">Loading…</p>
        </div>
    </div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="assets/app.js?v=1" defer></script>
</body>
</html>
